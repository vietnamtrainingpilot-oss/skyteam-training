<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  <script>
    // Preserve the hash route when redirecting to index.html
    var path = window.location.hash || '';
    if (path) {
      window.location.href = '/skyteam-training/' + path;
    } else {
      window.location.href = '/skyteam-training/';
    }
  </script>
</body>
</html>
