<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyTeam Training — Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #fafaf8;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { text-align: center; max-width: 480px; }
    h1 { font-size: 96px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
    p { margin-top: 16px; color: #6b6b64; font-size: 18px; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 12px 24px;
      background: #b8760e;
      color: #fff;
      text-decoration: none;
      border-radius: 980px;
      font-weight: 500;
      transition: transform 0.15s, background 0.15s;
    }
    a:hover { background: #965f0a; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>This page doesn't exist. Head back to training.</p>
    <a href="/skyteam-training/">← Back to Home</a>
  </div>
  <script>
    // SPA fallback for GitHub Pages: redirect to index.html with the original path preserved
    var path = window.location.pathname;
    // Remove /skyteam-training prefix for the replaceState
    if (path.startsWith('/skyteam-training')) {
      path = path.replace('/skyteam-training', '');
    }
    // Store the path in sessionStorage so index.html can restore it
    sessionStorage.setItem('spa-fallback-path', path);
    // Redirect to index.html
    window.location.href = '/skyteam-training/';
  </script>
</body>
</html>
