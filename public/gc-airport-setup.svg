<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="8" fill="#f8f9fa"/>
  <text x="300" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a18">Airport Setup Overview</text>
  <text x="300" y="55" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b6b64">Ground Crew operations zone</text>

  <rect x="50" y="80" width="500" height="260" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="50" y="80" width="500" height="30" rx="4" fill="#0f52ba" stroke="#0f52ba"/>
  <text x="70" y="100" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Home Airline Zone</text>

  <text x="80" y="135" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">Origin Airport</text>
  <circle cx="120" cy="150" r="3" fill="#0f52ba"/>
  <text x="130" y="155" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Set up airline zone</text>
  <circle cx="120" cy="170" r="3" fill="#0f52ba"/>
  <text x="130" y="175" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Track airlines & aircraft</text>
  <circle cx="120" cy="190" r="3" fill="#0f52ba"/>
  <text x="130" y="195" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Use FlightRadar 24</text>

  <text x="80" y="240" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#334155">Destination Airport</text>
  <circle cx="120" cy="255" r="3" fill="#d4a843"/>
  <text x="130" y="260" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Repeat setup for destination</text>
  <circle cx="120" cy="275" r="3" fill="#d4a843"/>
  <text x="130" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Leave vacant gate/stand</text>
  <circle cx="120" cy="295" r="3" fill="#d4a843"/>
  <text x="130" y="300" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Bring ground vehicles</text>

  <rect x="380" y="220" width="180" height="80" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="470" y="245" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#0284c7" font-weight="500">Stair Truck</text>
  <text x="470" y="262" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#0284c7">boarding bridge</text>
  <rect x="400" y="265" width="15" height="25" fill="#38bdf8"/>
  <polygon points="415,265 440,277 415,289" fill="#0284c7"/>

  <rect x="380" y="140" width="180" height="70" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="470" y="160" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#15803d" font-weight="500">Fuel Truck</text>
  <text x="470" y="175" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#15803d">supply aviation fuel</text>
  <rect x="390" y="170" width="20" height="8" fill="#4ade80"/>
  <rect x="400" y="180" width="12" height="10" fill="#22c55e"/>

  <rect x="380" y="70" width="180" height="60" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="470" y="95" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#b4870e" font-weight="500">Baggage Truck</text>
  <text x="470" y="110" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">transport luggage</text>
  <circle cx="440" cy="100" r="5" fill="#f59e0b"/>
  <circle cx="500" cy="100" r="5" fill="#f59e0b"/>
</svg>
