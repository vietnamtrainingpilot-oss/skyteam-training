<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" rx="8" fill="#f8f9fa"/>
  <text x="400" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a18">Rear Cone Configuration</text>
  <text x="400" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b6b64">Top-down view showing rear safety cone placement</text>

  <rect x="100" y="90" width="600" height="260" rx="6" fill="#eef2ff" stroke="#8b5cf6" stroke-width="2"/>

  <rect x="350" y="200" width="100" height="60" rx="4" fill="#c7d2fe"/>
  <text x="400" y="235" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#4f46e5">TAIL</text>
  <text x="400" y="255" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6366f1">Engine area</text>

  <circle cx="350" cy="195" r="10" fill="#f59e0b"/>
  <text x="350" y="210" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <circle cx="450" cy="195" r="10" fill="#f59e0b"/>
  <text x="450" y="210" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <circle cx="350" cy="265" r="10" fill="#f59e0b"/>
  <text x="350" y="280" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>
  <circle cx="450" cy="265" r="10" fill="#f59e0b"/>
  <text x="450" y="280" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <path d="M340,195 L310,195" stroke="#b4870e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460,195 L490,195" stroke="#b4870e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M340,265 L310,265" stroke="#b4870e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460,265 L490,265" stroke="#b4870e" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#b4870e"/>
    </marker>
  </defs>

  <rect x="200" y="300" width="400" height="60" rx="4" fill="#1e293b" stroke="#0f172a"/>
  <text x="400" y="340" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#f8fafc">GROUND CREW VEHICLES</text>
  <text x="400" y="360" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#cbd5e1">Remove all before departure</text>

  <circle cx="400" cy="120" r="4" fill="#94a3b8"/>
  <text x="410" y="125" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Marshaller position</text>
</svg>
