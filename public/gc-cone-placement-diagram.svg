<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="8" fill="#f8f9fa"/>
  <text x="400" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a18">Cone Placement Patterns</text>
  <text x="400" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b6b64">Correct cone positioning — place only when engines are off</text>

  <rect x="60" y="80" width="320" height="360" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="105" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0284c7">Side View</text>

  <rect x="150" y="160" width="240" height="180" rx="4" fill="#fff" stroke="#e2e8f0"/>
  <line x1="150" y1="250" x2="390" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4"/>

  <rect x="170" y="210" width="160" height="80" rx="4" fill="#c7d2fe"/>
  <text x="250" y="255" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4f46e5">AIRCRAFT</text>

  <circle cx="175" cy="295" r="8" fill="#f59e0b"/>
  <text x="175" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <circle cx="375" cy="295" r="8" fill="#f59e0b"/>
  <text x="375" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <rect x="200" y="295" width="110" height="4" fill="#d4a843"/>
  <text x="255" y="320" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">Safe zone (no cones)</text>

  <text x="100" y="130" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">• Place cones at departure end</text>
  <text x="100" y="145" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">• Remove before departure</text>
  <text x="100" y="160" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">• Engines off when placing</text>

  <rect x="440" y="80" width="320" height="360" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="105" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#b4870e">Front Cone Positioning</text>

  <rect x="520" y="150" width="60" height="140" rx="4" fill="#fff" stroke="#e2e8f0" transform="rotate(-15 550 220)"/>
  <text x="550" y="225" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#4f46e5" transform="rotate(-15 550 225)">AIRCRAFT</text>

  <circle cx="520" cy="170" r="10" fill="#d4a843"/>
  <text x="520" y="185" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <circle cx="520" cy="290" r="10" fill="#d4a843"/>
  <text x="520" y="305" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#b4870e">Cone</text>

  <path d="M520,170 L520,170 L560,165" stroke="#b4870e" stroke-width="2" stroke-dasharray="4"/>
  <path d="M520,290 L520,290 L560,295" stroke="#b4870e" stroke-width="2" stroke-dasharray="4"/>

  <text x="460" y="130" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">• Front cone marks no-go zone</text>
  <text x="460" y="145" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">• Place at wing root line</text>
  <text x="460" y="160" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">• Remove before pushback</text>

  <text x="600" y="360" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#475569">Legend: Orange circles = cones | Dashed lines = aircraft centerline</text>
</svg>
