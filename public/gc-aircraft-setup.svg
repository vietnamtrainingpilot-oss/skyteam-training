<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="8" fill="#f8f9fa"/>
  <text x="400" y="30" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a18">Ground Crew Vehicle Placement Guide</text>
  <text x="400" y="52" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6b6b64">Aircraft with all ground crew vehicles positioned correctly</text>

  <rect x="250" y="250" width="300" height="120" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#4338ca">AIRCRAFT</text>
  <rect x="330" y="280" width="40" height="90" fill="#c7d2fe"/>
  <rect x="370" y="290" width="30" height="70" fill="#a78bfa"/>
  <rect x="410" y="280" width="40" height="90" fill="#c7d2fe"/>
  <text x="430" y="260" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#6366f1">Tail</text>

  <g transform="translate(400,310)">
    <rect x="-5" y="-20" width="10" height="40" fill="#38bdf8"/>
    <polygon points="5,5 20,15 5,25" fill="#38bdf8"/>
    <polygon points="-15,5 -5,15 -15,25" fill="#38bdf8"/>
    <text x="0" y="12" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#0284c7">Stair</text>
  </g>
  <text x="410" y="320" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#0284c7">Stair Truck — Front left door</text>

  <g transform="translate(530,340)">
    <rect x="0" y="-15" width="28" height="15" fill="#4ade80"/>
    <rect x="5" y="-5" width="12" height="8" fill="#22c55e"/>
    <text x="14" y="0" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#15803d">Fuel</text>
  </g>
  <text x="565" y="355" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#15803d">Fuel Truck — Right wing</text>

  <g transform="translate(540,380)">
    <rect x="0" y="-15" width="28" height="15" fill="#fbbf24"/>
    <circle cx="14" cy="-8" r="4" fill="#f59e0b"/>
    <circle cx="14" cy="2" r="4" fill="#f59e0b"/>
    <text x="14" y="12" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#b4870e">Baggage</text>
  </g>
  <text x="575" y="400" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#b4870e">Baggage Truck — Right rear</text>

  <g transform="translate(300,390)">
    <rect x="0" y="-10" width="24" height="10" fill="#a78bfa"/>
    <polygon points="0,0 12,-5 12,5" fill="#a78bfa"/>
    <text x="12" y="3" font-family="Inter, system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#6366f1">Catering</text>
  </g>
  <text x="335" y="400" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#6366f1">Catering Truck — Front right door</text>

  <g transform="translate(280,280)">
    <rect x="0" y="-20" width="26" height="20" fill="#fb923c"/>
    <circle cx="13" cy="-10" r="6" fill="#f97316"/>
    <text x="13" y="0" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#b45202">Terminal Bus</text>
  </g>
  <text x="315" y="285" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#b45202">Terminal Bus — Bus stand</text>

  <g transform="translate(400,400)">
    <rect x="-30" y="0" width="60" height="12" fill="#ec4899"/>
    <polygon points="-30,0 -15,12 15,12 30,0" fill="#ec4899"/>
    <text x="0" y="8" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#be123c">Pushback Tug</text>
  </g>
  <text x="435" y="410" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#be123c">Pushback Tug — Front of aircraft</text>

  <circle cx="520" cy="200" r="3" fill="#0f52ba"/>
  <text x="530" y="204" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#0f52ba">Aircraft nose</text>

  <rect x="120" y="370" width="20" height="40" fill="#cbd8ff" stroke="#6366f1" stroke-width="1"/>
  <text x="130" y="395" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#4338ca">Cone</text>
  <rect x="680" y="370" width="20" height="40" fill="#cbd8ff" stroke="#6366f1" stroke-width="1"/>
  <text x="690" y="395" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle" fill="#4338ca">Cone</text>

  <rect x="380" y="20" width="40" height="30" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2"/>
  <text x="400" y="42" font-family="Inter, system-ui, sans-serif" font-size="8" text-anchor="middle" fill="#b4870e">Stand/Gate</text>

  <circle cx="420" cy="410" r="3" fill="#94a3b8"/>
  <text x="435" y="414" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Baggage Carousel</text>

  <text x="20" y="480" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">Legend: Blue = Stair/Gate vehicles | Green = Fuel | Yellow = Baggage | Purple = Catering/Bus | Pink = Pushback | Orange = Terminal Bus</text>
</svg>
